name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Bundle
        run: npm run bundle

      # Real-grammar tree-sitter suites skipIf grammars/ is absent. Build it so
      # those suites actually run in CI (grammarsTestSupport throws otherwise).
      - name: Copy tree-sitter grammars
        run: npm run copy-grammars

      - name: Tests
        run: npm test

      - name: Test coverage
        if: matrix.node-version == 24
        run: npm run test:coverage
