name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows is not a second full matrix: one job on the current LTS. The
      # Windows path shipped four real defects the Linux matrix could not see --
      # backslash path separators used as cache keys, an entirely untested
      # Windows shell path, and POSIX quoting handed to cmd.exe -- and 96 suite
      # failures that only appeared once someone ran it there. One job keeps it
      # honest without doubling CI minutes.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 24]
        include:
          - os: windows-latest
            node-version: 24
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # tsconfig.json does not include tests/, so the step above never saw it.
      # lint-staged runs this config too, but only when a tests/ file is staged
      # — a src/ change that breaks a test file's types reached main unnoticed.
      - name: Type check tests
        run: npm run compile:tests

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Bundle
        run: npm run bundle

      # Real-grammar tree-sitter suites skipIf grammars/ is absent. Build it so
      # those suites actually run in CI (grammarsTestSupport throws otherwise).
      - name: Copy tree-sitter grammars
        run: npm run copy-grammars

      - name: Tests
        run: npm test

      - name: Test coverage
        # Coverage once, on Linux: the Windows job is here to catch
        # platform-specific breakage, not to re-measure the same lines.
        if: matrix.node-version == 24 && matrix.os == 'ubuntu-latest'
        run: npm run test:coverage
